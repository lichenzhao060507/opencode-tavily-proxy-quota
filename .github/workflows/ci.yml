name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the version this plugin is developed and verified against.
        # `engines` still advertises >=22 for consumers.
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: `prepare` runs the build, which needs devDependencies
      # that are present anyway; skipping it keeps install side-effect free.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Verify dist is importable
        run: node --check dist/usage.js && node --check dist/tui.js && node --check dist/index.js
