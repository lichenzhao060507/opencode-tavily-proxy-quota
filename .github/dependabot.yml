version: 2
updates:
  # npm version updates are intentionally disabled.
  #
  # The runtime packages are dictated by OpenCode, not by us: @opentui/solid
  # pins solid-js to an exact version, so automated bumps of one without the
  # other always fail with ERESOLVE. Two of the three Dependabot PRs this repo
  # received were exactly that. Upgrade these by hand, together, and smoke-test
  # the TUI.
  #
  # Security updates are a separate repository setting and remain enabled, so
  # advisories still produce PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  # Workflow actions drift slowly and safely; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
